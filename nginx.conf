# volta-auth-proxy の upstream を1箇所にまとめる (#8)。
#
# 以前は 4 つの location ブロックに `192.168.1.13:7070` を直書きしていた。
# 環境ごとに差し替える前提の値が4箇所に散っていたため、**実機が .8 に移った後も
# .13 のまま残り、prod の /api ・/auth ・/.well-known ・/viz が全滅していた**
# （新旧どちらのルートも 000。2026-06-13 に発見、2026-08-13 に実測でも
# .13 は到達不能・.8 は 200 を確認）。
#
# ここを1行変えれば全ブロックに効く。envsubst でテンプレート化する場合も
# この1箇所を ${AUTH_PROXY_UPSTREAM} にすればよい。
upstream auth_proxy {
    # 実機: WSL 上の volta-auth-proxy。IP が変わったらここだけ直す。
    server 192.168.1.8:7070;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to volta-auth-proxy
    #
    # ▼ upstream の宛先はファイル冒頭の `upstream auth_proxy` 1箇所で決まる ▼
    # 以前はこのファイルの4箇所に IP を直書きしていて差し替え漏れが起きた (#8)。
    # この repo には Dockerfile / compose / entrypoint が含まれておらず、
    # イメージビルドと nginx.conf の供給は外部 (デプロイ基盤側) で行われる。
    # そのため envsubst テンプレート化 (nginx.conf.template + entrypoint で
    # env 展開) は、供給側の entrypoint を確認・改修できないまま行うと
    # 「${VAR} が展開されず literal のまま nginx に渡り起動失敗」する危険が
    # あるため、ここでは見送る。変数化する場合は供給側で
    #   - nginx.conf を nginx.conf.template にリネーム
    #   - entrypoint で `envsubst '${AUTH_PROXY_UPSTREAM}' < template > conf`
    #   - env AUTH_PROXY_UPSTREAM (default 192.168.1.8:7070) を注入
    # を一括で入れること。
    location /api/ {
        proxy_pass http://auth_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://auth_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://auth_proxy;
        proxy_set_header Host $host;
    }

    # Monitor ページ用 (tramli-viz): SSE / REST / WebSocket
    # SSE/WS を通すため proxy_http_version 1.1 と Upgrade/Connection ヘッダー必須。
    # SPEC 12.3 の設定例に準拠。
    location /viz/ {
        proxy_pass http://auth_proxy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;   # SSE/WS 用に長めに設定
    }
}
