name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (Vite)
        run: npm run build

      # #16: warn-only をやめた。既存の指摘（未使用変数・set-state-in-effect）は
      # 2026-08-13 に全部潰したので、これ以降の新規違反はここで止める。
      - name: Lint (ESLint)
        run: npm run lint

      # #9: これまで CI にテストが無く、回帰が誰にも検出されなかった。
      - name: Test (vitest)
        run: npm test
